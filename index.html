<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부동산 세금 노트</title>
<meta name="theme-color" content="#0f5c55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세금노트">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1c1b19; --muted:#6b675f; --line:#e4e0d6;
  --accent:#0f5c55; --accent-soft:#e3efec; --warn:#9a5b00; --warn-soft:#fbf1e1;
  --neg:#b3261e; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161614; --card:#201f1c; --ink:#f1efe9; --muted:#a19d93; --line:#34322d;
    --accent:#5fc2b5; --accent-soft:#1d3532; --warn:#e6b35c; --warn-soft:#352a17; --neg:#ff8a80; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:21px;letter-spacing:-.02em}
header .basis{font-size:13px;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font:inherit;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 4px;font:inherit;font-size:15px}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media (prefers-color-scheme: dark){ .seg button[aria-pressed=true]{color:#0c1f1d} }
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-weight:600;margin-bottom:6px;font-size:16px}
.field .hint{font-size:13px;color:var(--muted);margin-top:4px}
input[type=text],input[type=date],input[type=number],select{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.money-read{font-size:14px;color:var(--accent);margin-top:4px;min-height:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px}
.chips button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.check small{display:block;color:var(--muted);font-size:13px}
.result{background:var(--accent-soft);border-color:transparent}
.result .total{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.result .total small{font-size:16px;font-weight:600;color:var(--ink)}
table.steps{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
table.steps td{padding:8px 0;border-top:1px solid rgba(0,0,0,.07);vertical-align:top}
table.steps td.v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
table.steps td .d{display:block;font-size:12px;color:var(--muted);font-weight:400}
.neg{color:var(--neg)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.note p{margin:0 0 4px}
.disclaimer{font-size:13px;color:var(--muted);margin-top:8px}
.cat-list{display:grid;gap:10px}
.cat-btn{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--radius);padding:16px;font:inherit}
.cat-btn b{font-size:18px}
.cat-btn span{display:block;color:var(--muted);font-size:14px}
.back{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:0 0 10px}
.guide h2{font-size:22px;margin:0 0 4px}
.guide h3{font-size:17px;margin:0 0 8px;color:var(--accent)}
.guide ul{margin:0;padding-left:20px}
.guide li{margin-bottom:6px}
.links a{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--accent);text-decoration:none;font-weight:600}
.links a:first-child{border-top:0}
.search{margin-bottom:12px}
mark{background:#ffe58a;color:inherit;border-radius:3px}
.upd{border-left:4px solid var(--accent)}
.upd.plan{border-left-color:var(--warn)}
.upd .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
.badge{border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.upd.plan .badge{background:var(--warn-soft);color:var(--warn)}
.upd h3{margin:0 0 6px;font-size:17px}
.upd p{margin:0 0 6px;font-size:15px}
.upd a{font-size:14px;color:var(--accent)}
.areas{font-size:14px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.areas summary{color:var(--accent);font-weight:600;cursor:pointer}
.hidden{display:none!important}
.offline{font-size:13px;color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>부동산 세금 노트</h1>
  <div class="basis" id="basis">불러오는 중…</div>
</header>

<main>
  <!-- 계산기 -->
  <section id="tab-calc">
    <div class="seg" role="group" aria-label="계산기 종류">
      <button data-calc="yangdo" aria-pressed="true">양도세</button>
      <button data-calc="chwideuk" aria-pressed="false">취득세</button>
      <button data-calc="boyu" aria-pressed="false">보유세</button>
      <button data-calc="junggae" aria-pressed="false">중개보수</button>
    </div>
    <div id="calc-form"></div>
    <div id="calc-result"></div>
  </section>

  <!-- 가이드 -->
  <section id="tab-guide" class="hidden">
    <input type="text" id="guide-search" class="search" placeholder="검색 (예: 비과세, 일시적 2주택)" aria-label="가이드 검색">
    <div id="guide-body"></div>
  </section>

  <!-- 변경사항 -->
  <section id="tab-updates" class="hidden">
    <div id="updates-body"></div>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="calc" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/></svg>계산기</button>
  <button role="tab" data-tab="guide" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7M8 11h7"/></svg>세법 가이드</button>
  <button role="tab" data-tab="updates" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>변경사항</button>
</nav>

<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
